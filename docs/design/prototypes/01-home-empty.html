<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Folhário — Início</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ======================================================
       * Design tokens — Paper Cream / Night Cream (PRD §17)
       * Mirrors src/app/globals.css
       * ====================================================== */
      :root,
      [data-theme='light'] {
        --color-paper: #fbf7ef;
        --color-ivory: #fffdf7;
        --color-hairline: #e8e1d0;
        --color-canopy: #1f4d35;
        --color-forest: #143424;
        --color-slate: #5a6358;
        --color-sage: #8aa593;
        --color-terracotta: #c96f4a;
        --color-honey: #d4a340;
        --color-poppy: #c73e1d;
        --color-rust: #a14a2c;
        --color-trust: #2b6f7a;

        --font-serif: 'Source Serif 4', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;

        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --color-paper: #1a1613;
          --color-ivory: #231e1a;
          --color-hairline: #3a332b;
          --color-canopy: #6fae8a;
          --color-forest: #f2eadb;
          --color-slate: #b8b0a5;
          --color-sage: #a6bfae;
          --color-terracotta: #e08b66;
          --color-honey: #e8bc5e;
          --color-poppy: #e8593a;
          --color-rust: #c96a44;
          --color-trust: #5ba5b0;
        }
      }
      [data-theme='dark'] {
        --color-paper: #1a1613;
        --color-ivory: #231e1a;
        --color-hairline: #3a332b;
        --color-canopy: #6fae8a;
        --color-forest: #f2eadb;
        --color-slate: #b8b0a5;
        --color-sage: #a6bfae;
        --color-terracotta: #e08b66;
        --color-honey: #e8bc5e;
        --color-poppy: #e8593a;
        --color-rust: #c96a44;
        --color-trust: #5ba5b0;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-paper);
        color: var(--color-forest);
        font-family: var(--font-sans);
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      :where(:focus-visible) {
        outline: 3px solid color-mix(in srgb, var(--color-canopy) 40%, transparent);
        outline-offset: 2px;
        border-radius: 8px;
      }

      /* ======================================================
       * Desktop = tablet-width centered, bg fills sides.
       * Mobile = full width.
       * ====================================================== */
      .app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background-color: var(--color-paper);
        position: relative;
      }

      @media (min-width: 768px) {
        body {
          background-color: color-mix(in srgb, var(--color-paper) 70%, var(--color-hairline));
        }
        .app-shell {
          box-shadow: 0 0 60px color-mix(in srgb, var(--color-forest) 8%, transparent);
        }
      }

      /* ======================================================
       * Offline / read-only banners (top)
       * ====================================================== */
      .banner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        padding-top: calc(10px + var(--safe-top));
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
        border-bottom: 1px solid var(--color-hairline);
      }
      .banner[hidden] { display: none; }
      .banner--offline {
        background-color: color-mix(in srgb, var(--color-honey) 18%, var(--color-ivory));
        color: var(--color-rust);
      }
      .banner svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }

      /* ======================================================
       * Main content
       * ====================================================== */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 40px;
        text-align: center;
        gap: 32px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 320px;
      }

      .hero h1 {
        font-family: var(--font-serif);
        font-weight: 600;
        font-size: clamp(28px, 7vw, 34px);
        line-height: 1.15;
        margin: 0;
        color: var(--color-forest);
        letter-spacing: -0.01em;
      }

      .hero p {
        font-size: 16px;
        line-height: 1.5;
        color: var(--color-slate);
        margin: 0;
      }

      /* ======================================================
       * Camera CTA — large, breathing, 44px+ tap target
       * ====================================================== */
      .camera-cta {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 168px;
        height: 168px;
        border: none;
        border-radius: 50%;
        background-color: var(--color-canopy);
        color: var(--color-ivory);
        cursor: pointer;
        font-family: inherit;
        box-shadow: 0 12px 32px -8px color-mix(in srgb, var(--color-canopy) 50%, transparent);
        transition:
          transform 200ms ease,
          box-shadow 200ms ease,
          background-color 200ms ease;
      }

      .camera-cta:hover {
        background-color: var(--color-forest);
      }
      .camera-cta:active {
        transform: scale(0.96);
      }

      .camera-cta svg {
        width: 56px;
        height: 56px;
        stroke-width: 1.6;
      }

      .camera-cta__label {
        position: absolute;
        bottom: -36px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        font-weight: 600;
        color: var(--color-canopy);
        white-space: nowrap;
        letter-spacing: 0.02em;
      }

      /* Breathing pulse rings */
      .camera-cta::before,
      .camera-cta::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid var(--color-canopy);
        opacity: 0;
        pointer-events: none;
        animation: breathe 3.2s ease-out infinite;
      }
      .camera-cta::after {
        animation-delay: 1.6s;
      }

      @keyframes breathe {
        0% {
          transform: scale(0.95);
          opacity: 0.45;
        }
        80% {
          transform: scale(1.35);
          opacity: 0;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .camera-cta::before,
        .camera-cta::after {
          animation: none;
          opacity: 0;
        }
        .camera-cta,
        .camera-cta:active {
          transition: none;
          transform: none;
        }
      }

      .cta-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 56px;
      }

      /* ======================================================
       * Manual add link — secondary affordance
       * ====================================================== */
      .manual-add {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 600;
        color: var(--color-canopy);
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      .manual-add:hover {
        color: var(--color-forest);
      }

      /* ======================================================
       * Bottom navigation — 4 tabs, max 5 (PRD)
       * ====================================================== */
      .bottom-nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background-color: var(--color-ivory);
        border-top: 1px solid var(--color-hairline);
        padding-bottom: var(--safe-bottom);
      }

      .bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 64px;
        padding: 8px 4px;
        text-decoration: none;
        color: var(--color-slate);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: color 150ms ease;
      }
      .bottom-nav a:hover {
        color: var(--color-forest);
      }

      .bottom-nav a[aria-current='page'] {
        color: var(--color-canopy);
        font-weight: 600;
      }
      .bottom-nav a[aria-current='page'] svg {
        stroke-width: 2.2;
      }
      .bottom-nav a[aria-current='page']::before {
        content: '';
        position: absolute;
        margin-top: -8px;
        width: 28px;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background-color: var(--color-canopy);
      }
      .bottom-nav a {
        position: relative;
      }

      .bottom-nav svg {
        width: 24px;
        height: 24px;
        stroke-width: 1.7;
      }

      /* ======================================================
       * Theme toggle (prototype-only, top-right)
       * ====================================================== */
      .theme-toggle {
        position: absolute;
        top: calc(12px + var(--safe-top));
        right: 12px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        color: var(--color-slate);
        background-color: color-mix(in srgb, var(--color-ivory) 80%, transparent);
        border: 1px solid var(--color-hairline);
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
      }
      .theme-toggle:hover {
        color: var(--color-forest);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <button
        type="button"
        class="theme-toggle"
        aria-label="Alternar tema"
        onclick="(function(){var d=document.documentElement;var t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);})()"
      >
        Tema
      </button>

      <!-- Optional offline banner (toggle by removing the `hidden` attribute) -->
      <div
        class="banner banner--offline"
        role="status"
        aria-live="polite"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
        <span>Você está offline. Algumas ações serão sincronizadas quando a conexão voltar.</span>
      </div>

      <main id="main">
        <div class="hero">
          <h1>Identifique sua primeira planta</h1>
          <p>
            Use a câmera para descobrir o nome dela e como cuidar — direto no seu jardim.
          </p>
        </div>

        <div class="cta-block">
          <button
            type="button"
            class="camera-cta"
            aria-label="Identificar planta com a câmera"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span class="camera-cta__label">Identificar</span>
          </button>

          <a class="manual-add" href="/catalog/add">
            Adicionar manualmente
          </a>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <a href="/" aria-current="page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z" />
          </svg>
          <span>Início</span>
        </a>
        <a href="/catalog">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Catálogo</span>
        </a>
        <a href="/identify">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            />
            <circle cx="12" cy="13" r="4" />
          </svg>
          <span>Identificar</span>
        </a>
        <a href="/profile">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>
  </body>
</html>
