name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folhario_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate next-env.d.ts
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          SUPABASE_SERVICE_ROLE_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          IDENTIFICATION_PROVIDER_MODE: stub
        run: pnpm test:unit

      - name: DB setup (migrations + seeds + RLS guard + seed guard) per D-11
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          SUPABASE_SERVICE_ROLE_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          IDENTIFICATION_PROVIDER_MODE: stub
        run: pnpm db:setup

      - name: Integration tests (includes diagnostics-server-probe per D-27-a)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          SUPABASE_SERVICE_ROLE_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          IDENTIFICATION_PROVIDER_MODE: stub
          NEXT_PUBLIC_POSTHOG_KEY: ph_test_key
        run: pnpm test:integration

      - name: Build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          SUPABASE_SERVICE_ROLE_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          IDENTIFICATION_PROVIDER_MODE: stub
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_CI }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY_CI }}
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          # Next.js sets NODE_ENV=production during `next build`, which makes
          # serverEnv require RESEND_API_KEY. This is the CI build artefact,
          # not a deploy — placeholder satisfies the schema and never reaches
          # a real Resend call.
          RESEND_API_KEY: ci-build-placeholder
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Playwright smoke
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_CI }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY_CI }}
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          IDENTIFICATION_PROVIDER_MODE: stub
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/folhario_test
          SUPABASE_SERVICE_ROLE_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
          SENTRY_RELEASE: ${{ github.sha }}
          # Playwright spins up `next start`, which sets NODE_ENV=production
          # → serverEnv requires RESEND_API_KEY. Same placeholder as the
          # Build step (no Resend call ever fires in smoke tests).
          RESEND_API_KEY: ci-build-placeholder
        # CI runs against vanilla postgres:17-alpine without a Supabase Auth
        # stack. Restrict the smoke run to specs that exercise the rendered
        # app (security headers, PWA manifest/SW, axe a11y on placeholder
        # routes, horizontal-scroll guard) — anything that would call
        # supabase.auth.* lives behind `pnpm db:start` and runs locally.
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
