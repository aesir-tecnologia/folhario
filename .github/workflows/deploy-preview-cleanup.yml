name: Cleanup Preview Deploys

# Triggered when a PR is closed (merged or abandoned). Removes any Vercel
# preview deployments that were tagged with this PR's githubPrNumber meta.
on:
  pull_request:
    types: [closed]

concurrency:
  group: cleanup-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remove:
    name: Remove preview deployments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove tagged Vercel preview deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # No per-PR DB exists — all PRs share the same preview Supabase
          # project. This step only removes Vercel deployments.
          deployments=$(pnpm dlx vercel@latest list \
            --meta githubPrNumber="$PR_NUMBER" \
            --token="$VERCEL_TOKEN" --json 2>/dev/null | jq -r '.[].url' || true)

          if [ -z "$deployments" ]; then
            echo "No deployments found tagged githubPrNumber=$PR_NUMBER." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Removed preview deployments";
            echo "";
            echo "PR #$PR_NUMBER:";
            echo "";
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r url; do
            [ -z "$url" ] && continue
            pnpm dlx vercel@latest remove "$url" --yes --token="$VERCEL_TOKEN"
            echo "- \`$url\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$deployments"
