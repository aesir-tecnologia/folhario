name: _debug-preview-secrets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Inspect preview secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_URL: "https://xcnieozwakgxjkhtjifl.supabase.co"
        run: |
          probe() {
            local name="$1" val="$2" expected="$3"
            echo "=== $name ==="
            if [[ -z "$val" ]]; then
              echo "  state: EMPTY"
              return
            fi
            echo "  state: SET"
            echo "  length: ${#val}"
            echo "  starts_https: $([[ "$val" == https://* ]] && echo yes || echo no)"
            echo "  has_whitespace: $([[ "$val" =~ [[:space:]] ]] && echo yes || echo no)"
            echo "  has_quote: $([[ "$val" == *\"* ]] && echo yes || echo no)"
            echo "  has_apostrophe: $([[ "$val" == *\'* ]] && echo yes || echo no)"
            if [[ -n "$expected" ]]; then
              echo "  matches_expected: $([[ "$val" == "$expected" ]] && echo yes || echo no)"
              echo "  expected_length: ${#expected}"
            fi
          }
          probe "NEXT_PUBLIC_SUPABASE_URL" "$SUPABASE_URL" "$EXPECTED_URL"
          probe "SUPABASE_SERVICE_ROLE_KEY" "$SERVICE_ROLE" ""
          echo "  ends_supabase_co: $([[ "$SUPABASE_URL" == *.supabase.co ]] && echo yes || echo no)"
          probe "DATABASE_URL" "$DB_URL" ""
          if [[ -n "$DB_URL" ]]; then
            echo "  starts_postgresql: $([[ "$DB_URL" == postgresql://* || "$DB_URL" == postgres://* ]] && echo yes || echo no)"
            echo "  has_pooler_5432: $([[ "$DB_URL" == *pooler.supabase.com:5432* ]] && echo yes || echo no)"
            echo "  has_pooler_6543: $([[ "$DB_URL" == *pooler.supabase.com:6543* ]] && echo yes || echo no)"
            echo "  has_xcnieoz_ref: $([[ "$DB_URL" == *xcnieozwakgxjkhtjifl* || "$DB_URL" == *postgres.xcnieozwakgxjkhtjifl* ]] && echo yes || echo no)"
            echo "  has_tmxjmow_ref: $([[ "$DB_URL" == *tmxjmowxgkarnefmjotm* || "$DB_URL" == *postgres.tmxjmowxgkarnefmjotm* ]] && echo yes || echo no)"
          fi
