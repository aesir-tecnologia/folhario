name: _debug-preview-secrets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Inspect preview secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_URL: "https://xcnieozwakgxjkhtjifl.supabase.co"
        run: |
          # NEXT_PUBLIC_SUPABASE_URL is public by design; print it directly via
          # base64 to defeat GH's secret-masking (echo "$SUPABASE_URL" prints
          # *** because it's stored as a secret, not because it's sensitive).
          echo "NEXT_PUBLIC_SUPABASE_URL_B64: $(printf '%s' "$SUPABASE_URL" | base64 -w 0)"
          echo "NEXT_PUBLIC_SUPABASE_URL_LENGTH: ${#SUPABASE_URL}"
          echo "matches_expected: $([[ "$SUPABASE_URL" == "$EXPECTED_URL" ]] && echo yes || echo no)"
          echo "expected_length: ${#EXPECTED_URL}"
          echo "SERVICE_ROLE_state: $([[ -n "$SERVICE_ROLE" ]] && echo SET || echo EMPTY)"
          echo "SERVICE_ROLE_length: ${#SERVICE_ROLE}"
          echo "DB_URL_state: $([[ -n "$DB_URL" ]] && echo SET || echo EMPTY)"
          echo "DB_URL_length: ${#DB_URL}"
          if [[ -n "$DB_URL" ]]; then
            echo "DB_URL_has_xcnieoz_ref: $([[ "$DB_URL" == *xcnieozwakgxjkhtjifl* ]] && echo yes || echo no)"
            echo "DB_URL_has_tmxjmow_ref: $([[ "$DB_URL" == *tmxjmowxgkarnefmjotm* ]] && echo yes || echo no)"
            echo "DB_URL_port_5432: $([[ "$DB_URL" == *:5432* ]] && echo yes || echo no)"
            echo "DB_URL_port_6543: $([[ "$DB_URL" == *:6543* ]] && echo yes || echo no)"
          fi
